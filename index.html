<style>
:root{--bg:#15171a;--panel:#1f2226;--panel2:#262a2f;--line:#2e3238;--text:#e6e3dc;--mut:#8d9096;--or:#ff8a1f;--or2:#3a2a12;--orT:#ffb366;
--red:#e5484d;--teal:#5fd3c4;--fanuc:#e8d84a;--blue:#7fb2ff;--r:12px;color-scheme:dark}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;background:var(--bg);color:var(--text);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif}
body{padding:env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 90px)}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
.wrap{max-width:760px;margin:0 auto;padding:0 14px}
.hz{height:6px;background:repeating-linear-gradient(-45deg,var(--or) 0 9px,var(--bg) 9px 18px)}
header.top{position:sticky;top:0;z-index:5;background:var(--bg);padding:10px 0 8px;border-bottom:1px solid var(--line)}
.bar{display:flex;align-items:center;gap:10px}
.bar h1{font-size:17px;margin:0;font-weight:600;letter-spacing:.3px;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.sub{font-size:12px;color:var(--mut)}
.ib{background:none;border:0;width:40px;height:40px;border-radius:10px;display:grid;place-items:center;color:var(--text);font-size:22px;flex:none}
.ib:active{background:var(--panel2)}
.logo{color:var(--or);font-size:26px}
.search{display:flex;align-items:center;gap:8px;background:var(--panel2);border:1px solid var(--or);border-radius:var(--r);padding:0 12px;margin-top:10px}
.search i{color:var(--or);font-size:19px}
.search input{flex:1;background:none;border:0;outline:0;height:44px;font-size:16px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;padding:5px 11px;border-radius:20px;font-size:13px;background:var(--panel2);color:#c9c6bf;border:1px solid transparent;white-space:nowrap}
.chip.on{border-color:var(--or);color:var(--orT);background:var(--or2)}
.c-sin{background:#10302e;color:var(--teal)}.c-fan{background:#2b2f12;color:var(--fanuc)}.c-hei{background:#13263f;color:var(--blue)}
.c-shop{background:var(--or2);color:var(--orT)}.c-gray{background:var(--panel2);color:#c9c6bf}
h2.sec{font-size:12px;color:var(--mut);font-weight:500;text-transform:uppercase;letter-spacing:.8px;margin:18px 0 8px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:8px}
.tile{background:var(--panel);border:1px solid var(--line);border-radius:var(--r);padding:10px 12px;text-align:left}
.tile .n{font-size:22px;font-weight:600;color:var(--or)}
.tile .d{font-size:12px;color:var(--mut);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.row{display:block;width:100%;text-align:left;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:6px}
.row.t-fault{border-left:3px solid var(--red);border-radius:0 10px 10px 0}.row.t-setup{border-left:3px solid var(--or);border-radius:0 10px 10px 0}.row.t-guide{border-left:3px solid var(--teal);border-radius:0 10px 10px 0}
.row .t{font-weight:500}.row .m{font-size:12px;color:var(--mut);margin-top:2px}
.row mark,.hl{background:#5a3a10;color:#ffd7a8;border-radius:3px;padding:0 2px}
.fab{position:fixed;right:16px;bottom:calc(env(safe-area-inset-bottom) + 16px);z-index:6;background:var(--or);color:#1a1206;border:0;border-radius:16px;padding:14px 18px;font-weight:600;font-size:15px;display:flex;gap:6px;align-items:center}
.hero{height:150px;border-radius:var(--r);background:var(--panel2) center/cover;border:1px solid var(--line);display:flex;align-items:flex-end;padding:12px;margin:12px 0 10px;position:relative;overflow:hidden}

.hero>div{position:relative;z-index:1}.hero .nm{font-size:20px;font-weight:600}
.tabs{display:flex;gap:4px;background:var(--panel);border-radius:10px;padding:3px;margin:10px 0}

.legend{font-size:12px;color:var(--mut);margin-top:8px}
.photos{display:grid;grid-template-columns:repeat(4,1fr);gap:4px;margin:10px 0}
.photos .ph{aspect-ratio:1;border-radius:8px;background:var(--panel2) center/cover;border:0;position:relative}
.photos .ph .x{position:absolute;top:2px;right:2px;background:rgba(0,0,0,.7);border-radius:50%;width:24px;height:24px;display:grid;place-items:center;font-size:14px}
.steps{counter-reset:s;margin:6px 0 12px;padding:0;list-style:none}

.steps li::before{content:counter(s);position:absolute;left:0;top:5px;width:22px;height:22px;border-radius:6px;background:var(--or2);color:var(--orT);font-size:12px;display:grid;place-items:center;font-weight:600}
.params{background:#101214;border:1px solid var(--line);border-radius:10px;padding:8px 10px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:13px;margin-bottom:12px}

.actions{display:flex;gap:8px;margin:16px 0}
.btn{flex:1;background:var(--panel2);border:1px solid var(--line);border-radius:10px;padding:11px;font-weight:500}
.btn.pri{background:var(--or);border-color:var(--or);color:#1a1206}.btn.dan{color:#ff8f92}
form.ed label{display:block;font-size:12px;color:var(--mut);margin:12px 0 4px}
form.ed input,form.ed select,form.ed textarea{width:100%;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;outline:0;font-size:16px}

form.ed input:focus,form.ed select:focus,form.ed textarea:focus{border-color:var(--or)}
.hint{font-size:12px;color:var(--mut);margin-top:3px}
.seg{display:flex;gap:6px}.seg button{flex:1;border:1px solid var(--line);background:var(--panel);border-radius:10px;padding:9px 4px;font-size:13px}
.seg button.on.fault{border-color:var(--red);color:#ff9a9d}.seg button.on.setup{border-color:var(--or);color:var(--orT)}.seg button.on.guide{border-color:var(--teal);color:var(--teal)}
.sch{display:flex;align-items:center;gap:10px;background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:6px}
.sch i.big{font-size:26px;color:var(--or)}.sch .tx{flex:1;min-width:0}.sch .st{font-size:12px;color:var(--mut)}
.sch button{background:var(--panel2);border:1px solid var(--line);border-radius:8px;padding:6px 9px;font-size:13px;flex:none}
.empty{color:var(--mut);text-align:center;padding:24px 10px;font-size:14px}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.6);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.modal>div{background:var(--panel);border-radius:18px 18px 0 0;padding:18px 16px calc(env(safe-area-inset-bottom) + 16px);width:100%;max-width:560px;max-height:88vh;overflow:auto}
.modal h3{margin:0 0 8px;font-size:17px}.modal p{color:#c9c6bf;margin:0 0 12px;white-space:pre-line;font-size:14px}
.modal .opt{display:block;width:100%;text-align:left;margin-bottom:6px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(env(safe-area-inset-bottom) + 84px);background:#000;border:1px solid var(--line);color:var(--text);padding:10px 14px;border-radius:12px;z-index:30;font-size:14px;max-width:90vw}
.lb{position:fixed;inset:0;background:#000;z-index:25;display:flex;flex-direction:column}
.lb .img{flex:1;overflow:auto;display:flex;align-items:center;justify-content:center;touch-action:pinch-zoom pan-x pan-y}
.lb img{max-width:100%;max-height:100%}
.lb .tb{display:flex;justify-content:space-between;padding:calc(env(safe-area-inset-top) + 6px) 8px 6px;color:#fff}
.pv{position:fixed;inset:0;background:#0d0e10;z-index:22;display:flex;flex-direction:column}
.pv .tb{display:flex;align-items:center;gap:4px;padding:calc(env(safe-area-inset-top) + 6px) 6px 6px;background:var(--panel);border-bottom:1px solid var(--line)}
.pv .tb .ttl{flex:1;min-width:0;font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.pv .sb{display:flex;gap:6px;padding:6px 8px;background:var(--panel);align-items:center}
.pv .sb input{flex:1;background:var(--panel2);border:1px solid var(--or);border-radius:10px;padding:8px 10px;outline:0;font-size:16px;min-width:0}
.pv .sb .cnt{font-size:12px;color:var(--mut);min-width:64px;text-align:center}
.pv .pages{flex:1;overflow:auto;-webkit-overflow-scrolling:touch}
.pv .pg{margin:8px auto;background:#fff;position:relative}
.pv .pg canvas{display:block;width:100%;height:100%}
.pv .pg .hlb{position:absolute;background:rgba(255,138,31,.45);border:2px solid var(--or);border-radius:3px;pointer-events:none}
.pv .pg .no{position:absolute;top:4px;left:6px;font-size:11px;color:#666;font-family:sans-serif}
.prog{height:4px;background:var(--panel2);border-radius:2px;overflow:hidden;margin:8px 0}.prog div{height:100%;background:var(--or);width:0}
.foot{text-align:center;color:var(--mut);font-size:12px;margin:28px 0 8px}
</style>

<script>
// ===== Настройка Яндекс Диска =====
// ClientID приложения с https://oauth.yandex.ru (права: «Доступ к папке приложения на Диске»).
const YANDEX_CLIENT_ID = 'c898a0b8453a4af3a0e7a488aec34ff6';

const LS = 'bort-v1', LS_TOKEN = 'bort-ya', YA_DATA = 'app:/bortjournal.json', FILES = 'bort-files';
const TYPES = { fault: 'Неисправность', setup: 'Настройка', guide: 'Инструкция' };
const KINDS = { electro: 'Электросхемы', hydro: 'Гидро / пневмо' };
const CNCS = ['Sinumerik 840D', 'FANUC', 'Heidenhain', 'HURCO WinMax', 'Okuma OSP', 'Mitsubishi'];
const UNITS = ['Оси', 'Оси / линейки', 'Оси / конечники', 'Оси / подача', 'Шпиндель', 'Шпиндель / зажим', 'Поворотная голова', 'Магазин / смена инструмента',
  'Револьверная головка', 'Щуп / Renishaw', 'СОЖ', 'Гидравлика', 'Электрика', 'PLC', 'Датчики', 'Архив', 'Программирование', 'Прочее'];

const $ = s => document.querySelector(s);
const uid = () => Date.now().toString(36) + Math.random().toString(36).slice(2, 6);
const esc = s => String(s ?? '').replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;');
const low = s => String(s || '').toLowerCase().replace(/ё/g, 'е');
const fmtDate = d => d ? d.split('-').reverse().join('.') : '';
const today = () => new Date().toISOString().slice(0, 10);
const mb = n => (n / 1048576).toFixed(n > 1048576 * 10 ? 0 : 1) + ' МБ';
const hhmm = ts => new Date(ts).toLocaleTimeString('ru-RU', { hour: '2-digit', minute: '2-digit' });
const cncClass = c => /sinum|siemens/i.test(c) ? 'c-sin' : /fanuc/i.test(c) ? 'c-fan' : /heiden/i.test(c) ? 'c-hei' : 'c-gray';
const plural = (n, a, b, c) => n + ' ' + (n % 10 === 1 && n % 100 !== 11 ? a : n % 10 >= 2 && n % 10 <= 4 && (n % 100 < 10 || n % 100 >= 20) ? b : c);
const zap = n => plural(n, 'запись', 'записи', 'записей');
const cncShort = c => String(c || '').replace('Sinumerik 840D', '840D');

// ---------- состояние ----------
let DB = { machines: [], entries: [], schemes: [], deleted: {} };
let UI = { cnc: '' }, PENDING = [], yaToken = '', LOCALDATA = false;
const SYNC = { state: 'off', at: 0 };
let VIEW = { name: 'home' }, HISTORY = [], SEARCH = '';

function loadLocal() {
  try {
    const s = JSON.parse(localStorage.getItem(LS));
    if (s) { DB = s.db || DB; UI = { ...UI, ...(s.ui || {}) }; PENDING = s.pending || []; }
    yaToken = localStorage.getItem(LS_TOKEN) || '';
  } catch (e) {}
  DB.deleted ||= {}; DB.schemes ||= [];
}
function saveLocal() {
  try { localStorage.setItem(LS, JSON.stringify({ db: DB, ui: UI, pending: PENDING })); }
  catch (e) { toast('Не удалось сохранить: память браузера переполнена.'); }
}
const touch = o => { if (o) o.updated = Date.now(); saveLocal(); syncSoon(); };
const machine = id => DB.machines.find(m => m.id === id);
const entriesOf = id => DB.entries.filter(e => e.machine === id).sort((a, b) => b.date.localeCompare(a.date));
const shopsAll = () => [...new Set(DB.machines.flatMap(m => m.shops || []))].sort((a, b) => a.localeCompare(b, 'ru', { numeric: true }));

// ---------- файлы: кэш устройства + Яндекс Диск ----------
const fkey = p => new URL('./__files/' + p, location.href).href;
async function cacheGet(p) { try { const c = await caches.open(FILES); const r = await c.match(fkey(p)); return r ? r.blob() : null; } catch (e) { return null; } }
async function cachePut(p, blob) { try { const c = await caches.open(FILES); await c.put(fkey(p), new Response(blob)); } catch (e) {} }
async function cacheDel(p) { try { const c = await caches.open(FILES); await c.delete(fkey(p)); } catch (e) {} }
async function cacheHas(p) { try { const c = await caches.open(FILES); return !!(await c.match(fkey(p))); } catch (e) { return false; } }

async function getFile(p, { keep = true, progress } = {}) {
  const hit = await cacheGet(p); if (hit) return hit;
  let blob = null;
  if (LOCALDATA) { const r = await fetch('data/' + p); if (r.ok) blob = await r.blob(); }
  if (!blob && yaToken) blob = await yaGetBlob('app:/' + p, progress);
  if (!blob) throw 'nofile';
  if (keep) await cachePut(p, blob);
  return blob;
}
const urlCache = new Map();
async function fileURL(p) {
  if (urlCache.has(p)) return urlCache.get(p);
  const u = URL.createObjectURL(await getFile(p)); urlCache.set(p, u); return u;
}
function fillImages(root = document) {
  root.querySelectorAll('[data-img]').forEach(async el => {
    const p = el.dataset.img; el.removeAttribute('data-img');
    try { el.style.backgroundImage = `url("${await fileURL(p)}")`; } catch (e) { el.classList.add('noimg'); }
  });
}

// ---------- Яндекс Диск ----------
const yaRedirect = () => location.origin + location.pathname;
const yaAuthUrl = manual => 'https://oauth.yandex.ru/authorize?response_type=token&client_id=' + encodeURIComponent(YANDEX_CLIENT_ID)
  + '&redirect_uri=' + encodeURIComponent(manual ? 'https://oauth.yandex.ru/verification_code' : yaRedirect());
async function yaApi(path, opts = {}) {
  const r = await fetch('https://cloud-api.yandex.net/v1/disk' + path, { ...opts, headers: { Authorization: 'OAuth ' + yaToken, Accept: 'application/json' } });
  if (r.status === 401 || r.status === 403) throw 'auth';
  return r;
}
async function readWithProgress(resp, progress) {
  const total = +resp.headers.get('content-length') || 0;
  if (!progress || !resp.body || !total) return resp.blob();
  const rd = resp.body.getReader(), parts = []; let got = 0;
  for (;;) { const { done, value } = await rd.read(); if (done) break; parts.push(value); got += value.length; progress(got / total); }
  return new Blob(parts);
}
async function yaGetBlob(path, progress) {
  const r = await yaApi('/resources/download?path=' + encodeURIComponent(path));
  if (r.status === 404) return null;
  if (!r.ok) throw 'net';
  const { href } = await r.json();
  const f = await fetch(href, { referrerPolicy: 'no-referrer', cache: 'no-store' });
  if (!f.ok) throw 'net';
  return readWithProgress(f, progress);
}
async function yaPut(path, blob) {
  const r = await yaApi('/resources/upload?overwrite=true&path=' + encodeURIComponent(path));
  if (r.status === 409) { await yaMkdirFor(path); return yaPut(path, blob); }
  if (!r.ok) throw 'net';
  const { href } = await r.json();
  const u = await fetch(href, { method: 'PUT', referrerPolicy: 'no-referrer', body: blob });
  if (!u.ok) throw 'net';
}
const madeDirs = new Set();
async function yaMkdirFor(path) {
  const parts = path.replace('app:/', '').split('/').slice(0, -1);
  let cur = 'app:';
  for (const p of parts) {
    cur += '/' + p; if (madeDirs.has(cur)) continue;
    const r = await yaApi('/resources?path=' + encodeURIComponent(cur), { method: 'PUT' });
    if (!r.ok && r.status !== 409) throw 'net';
    madeDirs.add(cur);
  }
}
async function yaDelete(path) { try { await yaApi('/resources?permanently=false&path=' + encodeURIComponent(path), { method: 'DELETE' }); } catch (e) {} }

function mergeList(a, b, del) {
  const map = new Map();
  for (const x of b || []) map.set(x.id, x);
  for (const x of a || []) { const o = map.get(x.id); if (!o || (x.updated || 0) >= (o.updated || 0)) map.set(x.id, x); }
  for (const [id, ts] of Object.entries(del)) { const x = map.get(id); if (x && (x.updated || 0) <= ts) map.delete(id); }
  return [...map.values()];
}
function merge(r) {
  const del = { ...DB.deleted };
  for (const [id, ts] of Object.entries(r.deleted || {})) del[id] = Math.max(del[id] || 0, ts);
  return { machines: mergeList(DB.machines, r.machines, del), entries: mergeList(DB.entries, r.entries, del), schemes: mergeList(DB.schemes, r.schemes, del), deleted: del };
}
const sig = d => JSON.stringify(['machines', 'entries', 'schemes'].map(k => (d[k] || []).map(x => x.id + ':' + (x.updated || 0)).sort())) + Object.keys(d.deleted || {}).length;

let syncing = false, syncAgain = false, syncTimer;
function syncSoon(ms = 2500) { if (!yaToken) return; clearTimeout(syncTimer); syncTimer = setTimeout(() => sync(), ms); }
async function sync(manual) {
  if (!yaToken) return;
  if (syncing) { syncAgain = true; return; }
  syncing = true; SYNC.state = 'sync'; setStatus();
  try {
    await flushPending();
    const blob = await yaGetBlob(YA_DATA);
    const remote = blob ? JSON.parse(await blob.text()) : null;
    const before = sig(DB);
    const m = merge(remote || {});
    const changed = sig(m) !== before;
    DB = m; saveLocal();
    if (!remote || sig(remote) !== sig(DB)) await yaPut(YA_DATA, new Blob([JSON.stringify({ app: 'bortjournal', v: 1, ...DB, savedAt: Date.now() })], { type: 'application/json' }));
    SYNC.state = 'ok'; SYNC.at = Date.now();
    if (changed) render();
    if (manual) toast('Синхронизировано с Яндекс Диском');
  } catch (e) {
    if (e === 'auth') { yaToken = ''; try { localStorage.removeItem(LS_TOKEN); } catch (x) {} SYNC.state = 'auth'; toast('Вход в Яндекс истёк. Подключи Диск заново — данные на телефоне целы.'); }
    else { SYNC.state = 'offline'; if (manual) toast('Нет связи с Яндекс Диском. Всё сохранено на устройстве.'); }
  }
  syncing = false; setStatus();
  if (syncAgain) { syncAgain = false; syncSoon(500); }
}
async function flushPending() {
  while (PENDING.length) {
    const p = PENDING[0], blob = await cacheGet(p);
    if (blob) await yaPut('app:/' + p, blob);
    PENDING.shift(); saveLocal();
  }
}
function setStatus() {
  const el = $('#sync'); if (!el) return;
  el.textContent = LOCALDATA && !yaToken ? 'локальная копия' : !yaToken ? (SYNC.state === 'auth' ? '⚠ войди в Яндекс' : 'только на устройстве')
    : SYNC.state === 'sync' ? 'синхронизирую…' : SYNC.state === 'ok' ? '☁ Диск · ' + hhmm(SYNC.at) + (PENDING.length ? ' · ждут ' + PENDING.length : '')
    : SYNC.state === 'offline' ? 'нет связи · сохранено тут' : '☁ Яндекс Диск';
}
function readOAuthReturn() {

function ask({ title, text = '', options = null, ok = 'OK', cancel = 'Отмена', danger = false, input = null, value = '' }) {
  return new Promise(res => {
    const L = $('#layer'), m = document.createElement('div'); m.className = 'modal';
    m.innerHTML = `<div><h3>${esc(title)}</h3>${text ? `<p>${esc(text)}</p>` : ''}${input !== null ? `<form class="ed"><input id="ain" placeholder="${esc(input)}" value="${esc(value)}"></form>` : ''}
      <div id="aopts"></div><div class="actions">${options ? `<button class="btn" data-v="">${cancel}</button>` : `<button class="btn" data-v="">${cancel}</button><button class="btn ${danger ? 'dan' : 'pri'}" data-v="ok">${ok}</button>`}</div></div>`;
    const done = v => { m.remove(); res(v); };
    (options || []).forEach(o => { const b = document.createElement('button'); b.className = 'btn opt'; b.innerHTML = o.label; b.onclick = () => done(o.value); m.querySelector('#aopts').appendChild(b); });
    m.querySelectorAll('[data-v]').forEach(b => b.onclick = () => done(b.dataset.v === 'ok' ? (input !== null ? m.querySelector('#ain').value.trim() || null : true) : null));
    m.onclick = ev => { if (ev.target === m) done(null); };
    const f = m.querySelector('form'); if (f) f.onsubmit = ev => { ev.preventDefault(); done(m.querySelector('#ain').value.trim() || null); };
    L.appendChild(m); if (input !== null) setTimeout(() => m.querySelector('#ain').focus(), 50);
  });
}

function toast(t) { let el = $('.toast'); if (!el) { el = document.createElement('div'); el.className = 'toast'; document.body.appendChild(el); } el.textContent = t; el.hidden = false; clearTimeout(toastT); toastT = setTimeout(() => el.hidden = true, 3200); }

function mark(t, q) { t = esc(t); if (!q) return t; const i = low(t).indexOf(low(q)); return i < 0 ? t : t.slice(0, i) + '<mark>' + t.slice(i, i + q.length) + '</mark>' + t.slice(i + q.length); }
function entryText(x) { return [x.title, x.problem, ...(x.steps || []), ...(x.params || []).map(p => p.k + ' ' + p.v), x.note, x.unit, x.cnc, x.shop ? 'цех ' + x.shop : '', machine(x.machine)?.name].join(' \n '); }

async function resize(file, max, q) {
  const bmp = await createImageBitmap(file, { imageOrientation: 'from-image' }).catch(() => null);
  let img = bmp; if (!img) { img = new Image(); img.src = URL.createObjectURL(file); await img.decode(); }
  const k = Math.min(1, max / Math.max(img.width, img.height)), c = document.createElement('canvas');
  c.width = Math.round(img.width * k); c.height = Math.round(img.height * k); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  return new Promise(r => c.toBlob(r, 'image/jpeg', q));
}

async function openScheme(id, q = '', page = 0) {
  const s = DB.schemes.find(x => x.id === id); if (!s) return;
  const L = document.createElement('div'); L.className = 'pv';
  L.innerHTML = `<div class="tb"><button class="ib" data-a="x" aria-label="Закрыть"><i class="ti ti-x"></i></button><div class="ttl">${esc(s.title)}<div class="sub pinfo">загружаю…</div></div>
    <button class="ib" data-a="out" aria-label="Мельче"><i class="ti ti-zoom-out"></i></button><button class="ib" data-a="in" aria-label="Крупнее"><i class="ti ti-zoom-in"></i></button></div>
    <form class="sb"><input type="search" placeholder="Компонент: K12, SF1, I35.6 или лист: 63" value="${esc(q)}" enterkeyhint="search"><button type="button" class="ib" data-a="prev" aria-label="Предыдущее"><i class="ti ti-chevron-up"></i></button><span class="cnt"></span><button type="button" class="ib" data-a="next" aria-label="Следующее"><i class="ti ti-chevron-down"></i></button></form>
    <div class="prog" style="margin:0;border-radius:0" hidden><div></div></div><div class="pages"></div>`;
  $('#layer').appendChild(L);
  const info = L.querySelector('.pinfo'), pagesEl = L.querySelector('.pages'), cnt = L.querySelector('.cnt'), inp = L.querySelector('input'), prog = L.querySelector('.prog');
  L.querySelector('[data-a=x]').onclick = () => { L.remove(); };
  let pdf;
  try {
    const lib = await loadPdfJs();
    const local = await cacheHas('schemes/' + s.file);
    if (!local) prog.hidden = false;
    const blob = await getFile('schemes/' + s.file, { keep: false, progress: f => { prog.firstChild.style.width = f * 100 + '%'; info.textContent = 'качаю из облака ' + Math.round(f * 100) + '%'; } });
    prog.hidden = true;
    pdf = await lib.getDocument({ data: await blob.arrayBuffer() }).promise;
  } catch (e) { info.textContent = e === 'pdfjs' ? 'Нет связи: просмотрщик ещё не загружен' : (!yaToken && !LOCALDATA ? 'Подключи Яндекс Диск' : 'Схема недоступна без связи — скачай её на телефон'); return; }
  const N = pdf.numPages; info.textContent = N + ' листов';
  const first = await pdf.getPage(1), vp1 = first.getViewport({ scale: 1 }), ratio = vp1.height / vp1.width;
  let zoom = 1, hits = [], hi = -1;
  const W = () => Math.round((pagesEl.clientWidth - 16) * zoom);
  const nodes = [];
  for (let i = 1; i <= N; i++) { const d = document.createElement('div'); d.className = 'pg'; d.dataset.p = i; d.innerHTML = `<span class="no">${i}</span>`; pagesEl.appendChild(d); nodes.push(d); }
  const size = () => nodes.forEach(d => { d.style.width = W() + 'px'; d.style.height = Math.round(W() * ratio) + 'px'; });
  size();
  const rendered = new Map(); let busy = Promise.resolve();
  async function draw(d) {
    const i = +d.dataset.p, key = i + '@' + zoom; if (rendered.get(i) === key) return; rendered.set(i, key);
    const page = await pdf.getPage(i), w = W(), dpr = Math.min(devicePixelRatio || 1, zoom > 2 ? 2 : 3);
    const vp = page.getViewport({ scale: w / page.getViewport({ scale: 1 }).width * dpr });
    const c = document.createElement('canvas'); c.width = vp.width; c.height = vp.height;
    await page.render({ canvasContext: c.getContext('2d'), viewport: vp }).promise;
    d.querySelector('canvas')?.remove(); d.prepend(c); markHits(d);
  }
  const io = new IntersectionObserver(es => es.forEach(e => { if (e.isIntersecting) busy = busy.then(() => draw(e.target)).catch(() => {}); }), { root: pagesEl, rootMargin: '600px 0px' });
  nodes.forEach(d => io.observe(d));
  const textCache = new Map();
  async function pageText(i) {
    if (!textCache.has(i)) textCache.set(i, pdf.getPage(i).then(p => p.getTextContent().then(tc => ({ p, items: tc.items }))));
    return textCache.get(i);
  }
  function markHits(d) {
    d.querySelectorAll('.hlb').forEach(x => x.remove());
    const i = +d.dataset.p;

      const b = document.createElement('div'); b.className = 'hlb'; const k = W() / h.pw;
      Object.assign(b.style, { left: (h.x * k - 3) + 'px', top: (h.y * k - 3) + 'px', width: (h.w * k + 6) + 'px', height: (h.h * k + 6) + 'px' });
      if (hits[hi] === h) b.style.background = 'rgba(255,138,31,.75)';
      d.appendChild(b);
    });
  }
  async function find(q) {
    hits = []; hi = -1; nodes.forEach(markHits);
    q = q.trim(); if (!q) { cnt.textContent = ''; return; }
    if (/^\d+$/.test(q) && +q <= N && !/^\d{3,}$/.test(q) || /^(лист|стр)\s*\d+$/i.test(q)) { const n = +q.replace(/\D/g, ''); nodes[n - 1].scrollIntoView(); cnt.textContent = 'лист ' + n; return; }
    cnt.textContent = 'ищу…';
    const Q = q.toUpperCase().replace(/^[-+=]/, ''), idx = await loadIdx(s);
    let pages = idx[Q] ? idx[Q] : null;
    const list = pages || Array.from({ length: N }, (_, i) => i + 1);
    const norm = t => t.toUpperCase().replace(/\s+/g, '');
    for (const i of list) {
      const { p, items } = await pageText(i), vp = p.getViewport({ scale: 1 });
      for (const it of items) {
        const t = norm(it.str); if (!t.includes(norm(Q))) continue;
        const [a, b, c, dd, e, f] = pdfjsLib.Util.transform(vp.transform, it.transform);
        const fh = Math.hypot(c, dd) || 8, w = it.width, start = t.indexOf(norm(Q)) / Math.max(1, t.length);
        hits.push({ page: i, pw: vp.width, x: e + w * start, y: f - fh, w: Math.max(8, w * Math.min(1, norm(Q).length / Math.max(1, t.length))), h: fh });
      }
      if (inp.value.trim() !== q) return;
      if (!pages && i % 20 === 0) cnt.textContent = 'ищу… ' + i + '/' + N;
    }
    cnt.textContent = hits.length ? '1 / ' + hits.length : 'нет';
    if (hits.length) { hi = 0; jump(); }
    nodes.forEach(markHits);
  }
  function jump() {
    const h = hits[hi]; if (!h) return; cnt.textContent = (hi + 1) + ' / ' + hits.length;
    const d = nodes[h.page - 1], k = W() / h.pw;
    pagesEl.scrollTop = d.offsetTop - pagesEl.offsetTop + h.y * k - pagesEl.clientHeight / 3;
    pagesEl.scrollLeft = Math.max(0, d.offsetLeft + h.x * k - pagesEl.clientWidth / 2);
    nodes.forEach(markHits);
  }
  L.querySelector('form').onsubmit = e => { e.preventDefault(); inp.blur(); find(inp.value); };
  L.querySelector('[data-a=next]').onclick = () => { if (hits.length) { hi = (hi + 1) % hits.length; jump(); } };
  L.querySelector('[data-a=prev]').onclick = () => { if (hits.length) { hi = (hi - 1 + hits.length) % hits.length; jump(); } };
  const setZoom = z => {
    const cur = nodes.find(d => d.offsetTop + d.offsetHeight > pagesEl.scrollTop) || nodes[0], rel = (pagesEl.scrollTop - cur.offsetTop) / cur.offsetHeight;
    zoom = Math.max(1, Math.min(6, z)); size(); rendered.clear(); nodes.forEach(markHits);
    pagesEl.scrollTop = cur.offsetTop + rel * cur.offsetHeight; io.disconnect(); nodes.forEach(d => io.observe(d));
  };
  L.querySelector('[data-a=in]').onclick = () => setZoom(zoom * 1.6);
  L.querySelector('[data-a=out]').onclick = () => setZoom(zoom / 1.6);
  if (page) nodes[page - 1]?.scrollIntoView();
  if (q) find(q);
}

  } else { try { LOCALDATA = (await fetch('data/seed.json', { method: 'HEAD' })).ok; } catch (e) {} }

  if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
  try { navigator.storage?.persist?.(); } catch (e) {}
}
const _render = render;
render = function () { _render(); if (VIEW.name === 'machine' && VIEW.tab === 'schemes') schemeStates(); if (VIEW.name === 'settings') storInfo(); };
addEventListener('online', () => syncSoon(500));
document.addEventListener('visibilitychange', () => { if (!document.hidden) syncSoon(800); });
boot();
